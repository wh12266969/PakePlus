<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel按班级拆分工具</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .upload-area {
            border: 3px dashed #cbd5e0;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f7fafc;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #edf2f7;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: #eef2ff;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #4a5568;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #a0aec0;
            font-size: 12px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #48bb78;
        }

        .btn-danger {
            background: #f56565;
        }

        .config-panel {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .config-row {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .config-row label {
            font-weight: bold;
            color: #2d3748;
            min-width: 120px;
        }

        .config-row select, .config-row input {
            padding: 8px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 5px;
            font-size: 14px;
            flex: 1;
            min-width: 200px;
        }

        .preview-area {
            background: #f7fafc;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            max-height: 500px;
            overflow: auto;
        }

        .preview-title {
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .data-table th, .data-table td {
            border: 1px solid #e2e8f0;
            padding: 8px;
            text-align: left;
        }

        .data-table th {
            background: #edf2f7;
            font-weight: bold;
            position: sticky;
            top: 0;
        }

        .class-list {
            margin-top: 20px;
        }

        .class-item {
            background: white;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .class-name {
            font-weight: bold;
            color: #2d3748;
        }

        .class-count {
            color: #718096;
            font-size: 12px;
        }

        .result-area {
            background: #f0fff4;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .result-area.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .overlay.show {
            display: block;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .download-single {
            background: #48bb78;
            padding: 4px 12px;
            font-size: 12px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Excel 按班级拆分工具</h1>
            <p>上传Excel文件，自动按班级拆分成多个工作簿</p>
        </div>

        <div class="content">
            <div id="uploadArea" class="upload-area">
                <div class="upload-icon">📁</div>
                <div class="upload-text">点击或拖拽上传Excel文件</div>
                <div class="upload-hint">支持 .xlsx, .xls, .csv 格式</div>
                <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display: none;">
            </div>

            <div class="config-panel" id="configPanel" style="display: none;">
                <div class="config-row">
                    <label>选择班级列：</label>
                    <select id="classColumn"></select>
                </div>
                <div class="config-row">
                    <label>输出文件名前缀：</label>
                    <input type="text" id="filePrefix" placeholder="例如：班级_" value="班级_">
                </div>
                <div class="config-row">
                    <label>输出格式：</label>
                    <select id="outputFormat">
                        <option value="xlsx">Excel (.xlsx)</option>
                        <option value="csv">CSV (.csv)</option>
                    </select>
                </div>
            </div>

            <div id="previewArea" class="preview-area" style="display: none;">
                <div class="preview-title">📋 数据预览（前10行）</div>
                <div style="overflow-x: auto;">
                    <table id="previewTable" class="data-table"></table>
                </div>
                <div id="classList"></div>
            </div>

            <div id="actionButtons" style="text-align: center; display: none;">
                <button id="splitBtn" class="btn">📦 开始拆分</button>
                <button id="resetBtn" class="btn btn-danger">🔄 重新选择</button>
            </div>

            <div id="resultArea" class="result-area">
                <div class="preview-title">✅ 拆分完成！</div>
                <div id="resultContent"></div>
                <button id="downloadAllBtn" class="btn" style="margin-top: 15px;">📥 打包下载所有文件（ZIP）</button>
            </div>
        </div>
    </div>

    <div id="overlay" class="overlay"></div>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <div>正在处理中...</div>
    </div>

    <script>
        let originalData = null;
        let originalHeaders = null;
        let splitResults = [];
        let currentGroups = {};

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const configPanel = document.getElementById('configPanel');
        const previewArea = document.getElementById('previewArea');
        const actionButtons = document.getElementById('actionButtons');
        const loading = document.getElementById('loading');
        const overlay = document.getElementById('overlay');
        const resultArea = document.getElementById('resultArea');
        const classColumnSelect = document.getElementById('classColumn');
        const splitBtn = document.getElementById('splitBtn');
        const resetBtn = document.getElementById('resetBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');

        function showLoading() {
            loading.classList.add('show');
            overlay.classList.add('show');
        }

        function hideLoading() {
            loading.classList.remove('show');
            overlay.classList.remove('show');
        }

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && (file.name.endsWith('.xlsx') || file.name.endsWith('.xls') || file.name.endsWith('.csv'))) {
                handleFile(file);
            } else {
                alert('请上传Excel文件（.xlsx、.xls或.csv格式）');
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        function handleFile(file) {
            showLoading();
            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    let data = e.target.result;
                    let workbook;
                    
                    if (file.name.endsWith('.csv')) {
                        const text = data;
                        const lines = text.split('\n');
                        const headers = lines[0].split(',');
                        const jsonData = [];
                        for (let i = 1; i < lines.length; i++) {
                            if (lines[i].trim()) {
                                const values = lines[i].split(',');
                                const row = {};
                                headers.forEach((header, index) => {
                                    row[header.trim()] = values[index] ? values[index].trim() : '';
                                });
                                jsonData.push(row);
                            }
                        }
                        originalData = jsonData;
                        originalHeaders = headers.map(h => h.trim());
                    } else {
                        const arrayData = new Uint8Array(e.target.result);
                        workbook = XLSX.read(arrayData, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        originalData = XLSX.utils.sheet_to_json(firstSheet);
                        originalHeaders = originalData.length > 0 ? Object.keys(originalData[0]) : [];
                    }
                    
                    if (originalData.length === 0) {
                        alert('文件为空！');
                        hideLoading();
                        return;
                    }
                    
                    classColumnSelect.innerHTML = '<option value="">请选择班级列</option>';
                    originalHeaders.forEach(header => {
                        classColumnSelect.innerHTML += `<option value="${header}">${header}</option>`;
                    });
                    
                    showPreview(originalData, originalHeaders);
                    
                    configPanel.style.display = 'block';
                    previewArea.style.display = 'block';
                    actionButtons.style.display = 'block';
                    resultArea.classList.remove('show');
                    hideLoading();
                    
                } catch (error) {
                    alert('读取文件失败：' + error.message);
                    hideLoading();
                }
            };
            
            reader.onerror = function() {
                alert('文件读取失败！');
                hideLoading();
            };
            
            if (file.name.endsWith('.csv')) {
                reader.readAsText(file, 'UTF-8');
            } else {
                reader.readAsArrayBuffer(file);
            }
        }

        function showPreview(data, headers) {
            const previewData = data.slice(0, 10);
            let tableHtml = '<thead><tr>';
            headers.forEach(header => {
                tableHtml += `<th>${escapeHtml(header)}</th>`;
            });
            tableHtml += '</tr></thead><tbody>';
            
            previewData.forEach(row => {
                tableHtml += '<tr>';
                headers.forEach(header => {
                    const value = row[header] !== undefined && row[header] !== null ? String(row[header]) : '';
                    tableHtml += `<td>${escapeHtml(value.substring(0, 50))}</td>`;
                });
                tableHtml += '</tr>';
            });
            tableHtml += '</tbody>';
            
            document.getElementById('previewTable').innerHTML = tableHtml;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        splitBtn.addEventListener('click', () => {
            const classColumn = classColumnSelect.value;
            if (!classColumn) {
                alert('请选择班级列！');
                return;
            }
            
            if (!originalHeaders.includes(classColumn)) {
                alert('选择的班级列不存在！');
                return;
            }
            
            const groups = {};
            originalData.forEach(row => {
                let className = row[classColumn];
                if (className === undefined || className === null || className === '') {
                    className = '未分类';
                }
                className = String(className).trim();
                if (!groups[className]) {
                    groups[className] = [];
                }
                groups[className].push(row);
            });
            
            currentGroups = groups;
            
            const classListDiv = document.getElementById('classList');
            let classListHtml = '<div class="preview-title" style="margin-top: 20px;">🏫 班级列表</div>';
            for (const [className, students] of Object.entries(groups)) {
                classListHtml += `
                    <div class="class-item">
                        <span class="class-name">${escapeHtml(className)}</span>
                        <span class="class-count">${students.length} 人</span>
                    </div>
                `;
            }
            classListDiv.innerHTML = classListHtml;
            
            performSplit(groups);
        });

        function performSplit(groups) {
            showLoading();
            splitResults = [];
            
            const prefix = document.getElementById('filePrefix').value;
            const format = document.getElementById('outputFormat').value;
            
            setTimeout(() => {
                try {
                    for (const [className, data] of Object.entries(groups)) {
                        const ws = XLSX.utils.json_to_sheet(data);
                        const wb = XLSX.utils.book_new();
                        XLSX.utils.book_append_sheet(wb, ws, className.substring(0, 31));
                        
                        const safeClassName = className.replace(/[\\/:*?"<>|]/g, '_');
                        const fileName = `${prefix}${safeClassName}.${format}`;
                        
                        if (format === 'xlsx') {
                            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                            splitResults.push({
                                name: fileName,
                                data: wbout,
                                type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
                            });
                        } else {
                            const csv = XLSX.utils.sheet_to_csv(ws);
                            splitResults.push({
                                name: fileName,
                                data: csv,
                                type: 'text/csv;charset=utf-8'
                            });
                        }
                    }
                    
                    displayResults(groups);
                    hideLoading();
                    
                } catch (error) {
                    alert('拆分失败：' + error.message);
                    hideLoading();
                }
            }, 100);
        }

        function displayResults(groups) {
            const resultContent = document.getElementById('resultContent');
            let html = `<p>✅ 成功拆分成 ${splitResults.length} 个文件：</p>
                       <div style="max-height: 300px; overflow-y: auto; margin-top: 10px;">`;
            
            splitResults.forEach((file, index) => {
                const className = Object.keys(groups)[index];
                html += `
                    <div class="class-item" style="margin: 5px 0;">
                        <div>
                            <span class="class-name">📄 ${escapeHtml(file.name)}</span>
                            <span class="class-count">(${groups[className].length} 人)</span>
                        </div>
                        <button class="btn download-single" data-index="${index}">单独下载</button>
                    </div>
                `;
            });
            
            html += `</div><p style="margin-top: 15px; color: #48bb78;">💡 提示：点击"打包下载"可一次性下载所有文件</p>`;
            resultContent.innerHTML = html;
            resultArea.classList.add('show');
            
            document.querySelectorAll('.download-single').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = parseInt(e.target.getAttribute('data-index'));
                    downloadSingleFile(index);
                });
            });
        }

        function downloadSingleFile(index) {
            const file = splitResults[index];
            const blob = new Blob([file.data], { type: file.type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = file.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        downloadAllBtn.addEventListener('click', async () => {
            if (splitResults.length === 0) {
                alert('没有可下载的文件');
                return;
            }
            
            showLoading();
            
            try {
                const zip = new JSZip();
                
                for (const file of splitResults) {
                    zip.file(file.name, file.data);
                }
                
                const content = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = `班级拆分文件_${new Date().getTime()}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                hideLoading();
            } catch (error) {
                alert('打包失败：' + error.message);
                hideLoading();
            }
        });

        resetBtn.addEventListener('click', () => {
            originalData = null;
            originalHeaders = null;
            splitResults = [];
            currentGroups = {};
            fileInput.value = '';
            configPanel.style.display = 'none';
            previewArea.style.display = 'none';
            actionButtons.style.display = 'none';
            resultArea.classList.remove('show');
            document.getElementById('previewTable').innerHTML = '';
            document.getElementById('classList').innerHTML = '';
        });
    </script>
</body>
</html>
