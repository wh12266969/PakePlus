<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级管理 - 智能排课系统</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h3 {
            color: #1e3c72;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 2px solid #1e3c72;
            padding-bottom: 8px;
        }
        
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn {
            background: #1e3c72;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover { background: #2b4c7c; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-warning:hover { background: #e0a800; }
        .btn-info { background: #17a2b8; }
        .btn-info:hover { background: #138496; }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .data-table th, .data-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        .data-table th {
            background: #1e3c72;
            color: white;
        }
        .data-table tr:hover { background: #f5f5f5; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 20px;
            width: 450px;
            max-width: 90%;
        }
        .modal-content h4 {
            margin-top: 0;
            color: #1e3c72;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 5px;
            font-size: 13px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .search-select {
            position: relative;
        }
        .search-select input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .search-select-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }
        .search-select-dropdown div {
            padding: 8px;
            cursor: pointer;
        }
        .search-select-dropdown div:hover {
            background: #e8f4fd;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #28a745;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 2000;
            animation: fadeOut 2s ease-in-out;
        }
        .toast.error { background: #dc3545; }
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
    </style>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="container">
    <div class="card">
        <h3>🏫 班级管理</h3>
        
        <div class="toolbar">
            <button id="addBtn" class="btn btn-success">+ 添加班级</button>
            <button id="syncFromMatrixBtn" class="btn btn-info">🔄 从矩阵同步班主任</button>
            <button id="importBtn" class="btn">📥 导入Excel</button>
            <button id="exportBtn" class="btn">📤 导出Excel</button>
            <button id="downloadTemplateBtn" class="btn btn-warning">📎 下载模板</button>
        </div>
        
        <table class="data-table" id="dataTable">
            <thead>
                <tr><th>ID</th><th>类别</th><th>班级名称</th><th>班主任</th><th>操作</th> </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<!-- 编辑模态框 -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h4 id="modalTitle">添加班级</h4>
        <div class="form-group">
            <label>类别</label>
            <select id="categoryId"></select>
        </div>
        <div class="form-group">
            <label>班级名称</label>
            <input type="text" id="className" placeholder="如：高一1班">
        </div>
        <div class="form-group">
            <label>班主任</label>
            <div class="search-select">
                <input type="text" id="teacherSearch" placeholder="🔍 搜索或选择班主任...">
                <div id="teacherDropdown" class="search-select-dropdown"></div>
                <input type="hidden" id="selectedTeacher">
            </div>
        </div>
        <div class="modal-buttons">
            <button id="cancelBtn" class="btn btn-danger">取消</button>
            <button id="saveBtn" class="btn btn-success">保存</button>
        </div>
    </div>
</div>

<script>
    const CLASS_KEY = "pk_classes";
    const CATEGORY_KEY = "pk_categories";
    const PLANS_KEY = "pk_plans";
    const TEACHERS_KEY = "pk_teachers";
    let classes = [];
    let categories = [];
    let teachers = [];
    let editingId = null;
    
    function loadData() {
        let stored = localStorage.getItem(CLASS_KEY);
        if (stored) classes = JSON.parse(stored);
        else classes = [];
        
        let catStored = localStorage.getItem(CATEGORY_KEY);
        if (catStored) categories = JSON.parse(catStored);
        else categories = [];
        
        let teacherStored = localStorage.getItem(TEACHERS_KEY);
        if (teacherStored) teachers = JSON.parse(teacherStored);
        else teachers = [];
        
        renderTable();
    }
    
    function saveData() {
        localStorage.setItem(CLASS_KEY, JSON.stringify(classes));
        renderTable();
    }
    
    function getCategoryName(id) {
        let c = categories.find(c => c.id == id);
        return c ? c.name : "未知";
    }
    
    function renderTable() {
        let tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        for (let item of classes) {
            let row = tbody.insertRow();
            row.insertCell(0).innerText = item.id;
            row.insertCell(1).innerText = getCategoryName(item.categoryId);
            row.insertCell(2).innerText = item.name;
            row.insertCell(3).innerText = item.teacher || "";
            let actionCell = row.insertCell(4);
            actionCell.innerHTML = `<button class="edit-btn" data-id="${item.id}" style="background:#ffc107; color:#333; border:none; padding:4px 10px; border-radius:4px; margin-right:5px; cursor:pointer;">编辑</button>
                                    <button class="delete-btn" data-id="${item.id}" style="background:#dc3545; color:white; border:none; padding:4px 10px; border-radius:4px; cursor:pointer;">删除</button>`;
        }
        
        document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.onclick = () => openEditModal(parseInt(btn.dataset.id));
        });
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.onclick = () => {
                if (confirm("确定删除吗？")) {
                    classes = classes.filter(i => i.id !== parseInt(btn.dataset.id));
                    saveData();
                    showToast("已删除");
                }
            };
        });
    }
    
    function renderCategorySelect(selectedId) {
        let select = document.getElementById("categoryId");
        select.innerHTML = '<option value="">请选择类别</option>';
        for (let cat of categories) {
            select.innerHTML += `<option value="${cat.id}" ${selectedId === cat.id ? 'selected' : ''}>${escapeHtml(cat.name)}</option>`;
        }
    }
    
    // 设置教师搜索选择器
    function setupTeacherSearch(selectedTeacherName) {
        let searchInput = document.getElementById("teacherSearch");
        let dropdown = document.getElementById("teacherDropdown");
        let hiddenInput = document.getElementById("selectedTeacher");
        
        // 如果有已选班主任，显示在输入框
        if (selectedTeacherName) {
            searchInput.value = selectedTeacherName;
            hiddenInput.value = selectedTeacherName;
        } else {
            searchInput.value = "";
            hiddenInput.value = "";
        }
        
        // 输入事件
        searchInput.oninput = function() {
            let keyword = this.value.toLowerCase();
            let filtered = teachers.filter(t => t.name && t.name.toLowerCase().includes(keyword));
            
            if (filtered.length > 0 && keyword) {
                dropdown.innerHTML = filtered.map(t => `<div data-name="${escapeHtml(t.name)}">${escapeHtml(t.name)}</div>`).join('');
                dropdown.style.display = 'block';
                
                dropdown.querySelectorAll('div').forEach(div => {
                    div.onclick = () => {
                        searchInput.value = div.dataset.name;
                        hiddenInput.value = div.dataset.name;
                        dropdown.style.display = 'none';
                    };
                });
            } else {
                dropdown.style.display = 'none';
            }
        };
        
        // 点击外部关闭下拉框
        document.addEventListener('click', function(e) {
            if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });
        
        // 如果输入框有内容但没有匹配，点击时显示所有教师
        searchInput.onfocus = function() {
            if (teachers.length > 0) {
                dropdown.innerHTML = teachers.map(t => `<div data-name="${escapeHtml(t.name)}">${escapeHtml(t.name)}</div>`).join('');
                dropdown.style.display = 'block';
                
                dropdown.querySelectorAll('div').forEach(div => {
                    div.onclick = () => {
                        searchInput.value = div.dataset.name;
                        hiddenInput.value = div.dataset.name;
                        dropdown.style.display = 'none';
                    };
                });
            }
        };
    }
    
    function openEditModal(id) {
        editingId = id;
        if (id) {
            let item = classes.find(i => i.id === id);
            document.getElementById("modalTitle").innerText = "编辑班级";
            document.getElementById("className").value = item.name;
            renderCategorySelect(item.categoryId);
            setupTeacherSearch(item.teacher || "");
        } else {
            document.getElementById("modalTitle").innerText = "添加班级";
            document.getElementById("className").value = "";
            renderCategorySelect(null);
            setupTeacherSearch("");
        }
        document.getElementById("editModal").style.display = "flex";
    }
    
    function saveClass() {
        let categoryId = document.getElementById("categoryId").value;
        let name = document.getElementById("className").value.trim();
        let teacher = document.getElementById("selectedTeacher").value;
        
        if (!categoryId) { showToast("请选择类别", true); return; }
        if (!name) { showToast("请输入班级名称", true); return; }
        
        if (editingId) {
            let index = classes.findIndex(i => i.id === editingId);
            if (index !== -1) {
                classes[index] = { ...classes[index], categoryId: parseInt(categoryId), name, teacher };
            }
            showToast("已更新");
        } else {
            let newId = Math.max(0, ...classes.map(i => i.id), 0) + 1;
            classes.push({ id: newId, categoryId: parseInt(categoryId), name, teacher });
            showToast("已添加");
        }
        saveData();
        closeModal();
    }
    
    // 从教学计划矩阵同步班主任
    function syncFromMatrix() {
        let plansStr = localStorage.getItem(PLANS_KEY);
        if (!plansStr) {
            showToast("暂无教学计划数据", true);
            return;
        }
        let plans = JSON.parse(plansStr);
        if (plans.length === 0) {
            showToast("暂无教学计划数据", true);
            return;
        }
        
        // 从教学计划中提取班级和教师的关系
        let classTeacherMap = new Map();
        for (let plan of plans) {
            let className = plan.className;
            let teacherName = plan.teacher || plan.teacherName;
            if (className && teacherName && !classTeacherMap.has(className)) {
                classTeacherMap.set(className, teacherName);
            }
        }
        
        // 更新班级的班主任
        let updatedCount = 0;
        for (let cls of classes) {
            if (classTeacherMap.has(cls.name)) {
                cls.teacher = classTeacherMap.get(cls.name);
                updatedCount++;
            }
        }
        
        saveData();
        showToast(`同步完成，更新了 ${updatedCount} 个班级的班主任`);
    }
    
    function closeModal() {
        document.getElementById("editModal").style.display = "none";
        editingId = null;
    }
    
    function exportData() {
        let wsData = [["ID", "类别", "班级名称", "班主任"]];
        for (let item of classes) {
            wsData.push([item.id, getCategoryName(item.categoryId), item.name, item.teacher || ""]);
        }
        let ws = XLSX.utils.aoa_to_sheet(wsData);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "班级管理");
        XLSX.writeFile(wb, "班级管理.xlsx");
        showToast("导出成功");
    }
    
    function downloadTemplate() {
        let wsData = [["类别", "班级名称", "班主任"], ["理科", "高一1班", "张老师"], ["文科", "高一2班", "李老师"]];
        let ws = XLSX.utils.aoa_to_sheet(wsData);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "班级模板");
        XLSX.writeFile(wb, "班级模板.xlsx");
        showToast("模板下载成功");
    }
    
    function importExcel(file) {
        let reader = new FileReader();
        reader.onload = function(e) {
            let workbook = XLSX.read(e.target.result, { type: 'array' });
            let sheet = workbook.Sheets[workbook.SheetNames[0]];
            let rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            if (!rows || rows.length < 2) { showToast("文件至少需要两行", true); return; }
            let newCount = 0;
            let maxId = Math.max(0, ...classes.map(i => i.id), 0);
            for (let i = 1; i < rows.length; i++) {
                let row = rows[i];
                if (!row[0] || !row[0].toString().trim()) continue;
                let categoryName = row[0].toString().trim();
                let className = row[1] ? row[1].toString().trim() : "";
                let teacher = row[2] ? row[2].toString().trim() : "";
                if (!className) continue;
                let category = categories.find(c => c.name === categoryName);
                if (!category) continue;
                if (!classes.some(c => c.name === className)) {
                    maxId++;
                    classes.push({ id: maxId, categoryId: category.id, name: className, teacher });
                    newCount++;
                }
            }
            saveData();
            showToast(`导入完成，新增 ${newCount} 条`);
        };
        reader.readAsArrayBuffer(file);
    }
    
    function showToast(msg, isErr) {
        let t = document.createElement("div");
        t.className = "toast" + (isErr ? " error" : "");
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2000);
    }
    
    function escapeHtml(s) {
        if (!s) return '';
        return s.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function init() {
        loadData();
        document.getElementById("addBtn").onclick = () => openEditModal(null);
        document.getElementById("cancelBtn").onclick = closeModal;
        document.getElementById("saveBtn").onclick = saveClass;
        document.getElementById("exportBtn").onclick = exportData;
        document.getElementById("downloadTemplateBtn").onclick = downloadTemplate;
        document.getElementById("syncFromMatrixBtn").onclick = syncFromMatrix;
        document.getElementById("importBtn").onclick = () => {
            let input = document.createElement("input");
            input.type = "file";
            input.accept = ".xlsx, .xls";
            input.onchange = e => { if (e.target.files[0]) importExcel(e.target.files[0]); };
            input.click();
        };
        window.onclick = e => { if (e.target === document.getElementById("editModal")) closeModal(); };
    }
    init();
</script>
</body>
</html>
