<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试考务安排 - 智能排课系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .top-bar { background: linear-gradient(135deg, #1e3c72 0%, #2b4c7c 100%); color: white; padding: 12px 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .logo { font-size: 20px; font-weight: bold; }
        .logo span { color: #ffd700; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-name { background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 20px; font-size: 13px; }
        .back-btn, .logout-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 13px; }
        .back-btn:hover, .logout-btn:hover { background: #dc3545; }
        
        .card { background: white; border-radius: 12px; padding: 14px 18px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .card-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .card-header h3 { color: #1e3c72; font-size: 16px; border: none; padding: 0; margin: 0; }
        .btn-group { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        
        .btn { padding: 4px 10px; border: none; border-radius: 5px; font-size: 12px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #1e3c72; color: white; }
        .btn-primary:hover { background: #2b4c7c; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #218838; }
        .btn-warning { background: #ffc107; color: #1e3c72; }
        .btn-warning:hover { background: #e0a800; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-sm { padding: 2px 8px; font-size: 11px; }
        
        .category-list { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
        .category-item { background: #f0f2f5; border-radius: 20px; padding: 3px 12px; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s; font-size: 12px; }
        .category-item.active { background: #1e3c72; color: white; }
        .category-item:hover:not(.active) { background: #e0e7ff; }
        .delete-cat { color: #dc3545; cursor: pointer; font-size: 12px; }
        .category-item.active .delete-cat { color: #ffd700; }
        
        .config-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin: 12px 0; padding: 8px 12px; background: #f8f9fa; border-radius: 8px; }
        .config-item { display: flex; flex-direction: column; gap: 2px; }
        .config-item label { font-size: 10px; font-weight: bold; color: #666; }
        .config-item input { padding: 4px 6px; border: 1px solid #ddd; border-radius: 5px; width: 70px; font-size: 12px; }
        
        .exam-table, .teacher-table, .stat-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        .exam-table th, .exam-table td, .teacher-table th, .teacher-table td, .stat-table th, .stat-table td { border: 1px solid #e2e8f0; padding: 6px 8px; text-align: left; }
        .exam-table th, .teacher-table th, .stat-table th { background: #eef2ff; font-weight: 600; }
        
        .teacher-list { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
        .teacher-item { background: #eef2ff; padding: 2px 8px; border-radius: 14px; font-size: 11px; }
        
        .add-exam-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-top: 12px; padding: 8px 12px; background: #f8f9fa; border-radius: 8px; }
        .add-exam-form input { padding: 5px 8px; border: 1px solid #ddd; border-radius: 5px; font-size: 12px; }
        .add-exam-form input[type="text"] { width: 90px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; border-radius: 16px; width: 90%; max-width: 1300px; max-height: 85%; overflow: auto; padding: 16px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #e2e8f0; }
        .modal-header h2 { color: #1e3c72; font-size: 18px; }
        .close-modal { font-size: 22px; cursor: pointer; background: none; border: none; }
        
        .matrix-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .matrix-table th, .matrix-table td { border: 1px solid #ddd; padding: 8px 6px; text-align: center; vertical-align: middle; }
        .matrix-table th { background: #4472C4; color: white; font-weight: 600; }
        .matrix-table td:first-child { background: #D9E1F2; font-weight: bold; }
        
        .teacher-cell { 
            cursor: grab; 
            transition: 0.1s; 
            padding: 4px 8px; 
            margin: 2px; 
            border-radius: 6px; 
            background: #eef2ff; 
            font-size: 12px; 
            display: inline-block; 
            user-select: none;
        }
        .teacher-cell:active { cursor: grabbing; }
        .teacher-cell.drag-over { background-color: #d4edda; border: 1px dashed #28a745; }
        .teacher-cell.highlight { background-color: #ffc107; color: #1e3c72; font-weight: bold; box-shadow: 0 0 0 2px #ffc107; }
        
        .teacher-slot { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
        
        .stat-item { background: #e6f7e6; padding: 6px 10px; border-radius: 6px; margin-top: 8px; font-size: 12px; line-height: 1.6; }
        .status-msg { color: #666; padding: 6px; text-align: center; font-size: 12px; }
        .warning-text { color: #dc3545; font-size: 10px; margin-top: 5px; }
        .current-badge { background: #eef2ff; padding: 3px 10px; border-radius: 16px; font-size: 12px; }
        .time-hint { font-size: 9px; color: #999; margin-top: 2px; }
        
        .toast { position: fixed; bottom: 30px; right: 30px; background: #28a745; color: white; padding: 8px 15px; border-radius: 6px; z-index: 2000; animation: fadeOut 2s ease-in-out; font-size: 12px; }
        .toast.error { background: #dc3545; }
        @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
        
        .unassigned-area { margin-top: 12px; padding: 8px 12px; background: #fff3cd; border-radius: 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .unassigned-badge { background: #ffc107; color: #1e3c72; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .unassigned-teacher { background: #ffebcc; padding: 2px 8px; border-radius: 14px; font-size: 11px; cursor: pointer; }
        .unassigned-teacher:hover { background: #ffc107; }
        
        .clear-highlight-btn { background: #6c757d; color: white; padding: 2px 8px; border-radius: 12px; font-size: 10px; cursor: pointer; }
        .clear-highlight-btn:hover { background: #5a6268; }
        
        .inline-input { width: 100px; padding: 4px 8px; border-radius: 16px; border: 1px solid #ddd; font-size: 12px; }
        .small-select { padding: 4px 8px; border-radius: 5px; border: 1px solid #ddd; font-size: 12px; }
        
        .export-config { display: flex; flex-direction: column; gap: 12px; }
        .config-row { display: flex; align-items: center; gap: 10px; }
        .config-row label { width: 70px; font-size: 12px; font-weight: bold; }
        .config-row input, .config-row select { flex: 1; padding: 6px 8px; border: 1px solid #ddd; border-radius: 5px; font-size: 12px; }
        .warning-box { background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 10px; margin: 10px 0; }
        .warning-box .title { font-weight: bold; color: #856404; margin-bottom: 8px; }
        .radio-group { display: flex; gap: 20px; margin-top: 8px; }
        .radio-group label { display: flex; align-items: center; gap: 5px; font-weight: normal; width: auto; }
        
        .drag-hint { font-size: 11px; color: #666; text-align: center; margin-top: 10px; padding: 6px; background: #f8f9fa; border-radius: 6px; }
    </style>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div class="logo">智能<span>排课系统</span> - 考试考务安排</div>
        <div class="user-info">
            <span class="user-name" id="userNameDisplay">管理员</span>
            <button class="back-btn" id="backBtn">← 返回目录</button>
            <button class="logout-btn" id="logoutBtn">退出登录</button>
        </div>
    </div>

    <!-- 卡片一：类别管理 -->
    <div class="card">
        <div class="card-header">
            <h3>🏷️ 类别管理</h3>
            <div class="btn-group">
                <input type="text" id="newCategoryName" placeholder="新类别" class="inline-input" style="width:100px;">
                <button id="addCategoryBtn" class="btn btn-primary">➕ 添加</button>
            </div>
        </div>
        <div id="categoryList" class="category-list"></div>
    </div>

    <!-- 卡片二：考试计划管理 -->
    <div class="card">
        <div class="card-header">
            <h3>📋 考试计划管理</h3>
            <div class="btn-group">
                <button id="downloadExamTemplateBtn" class="btn btn-secondary">📥 模板</button>
                <button id="importExamBtn" class="btn btn-primary">📂 导入</button>
                <button id="clearExamsBtn" class="btn btn-danger">🗑️ 清除</button>
                <span id="currentCategoryDisplay" class="current-badge"></span>
            </div>
        </div>
        
        <div class="config-bar">
            <div class="config-item"><label>科目数</label><input type="number" id="editSubjectCount" value="3" min="1" max="30"></div>
            <div class="config-item"><label>考场数</label><input type="number" id="editRoomCount" value="3" min="1" max="30"></div>
            <div class="config-item"><label>监考人数/场</label><input type="number" id="editInvigilatorCount" value="2" min="1" max="4"></div>
            <button id="saveConfigBtn" class="btn btn-primary">💾 保存</button>
        </div>

        <div id="examListContainer"></div>

        <div class="add-exam-form">
            <input type="text" id="newExamName" placeholder="考试名称" style="width:100px;">
            <input type="text" id="newExamSubject" placeholder="科目" style="width:80px;">
            <input type="date" id="newExamDate" placeholder="日期" style="width:120px;">
            <input type="text" id="newExamStartTime" placeholder="开始 如09:00" style="width:90px;">
            <input type="text" id="newExamEndTime" placeholder="结束 如11:00" style="width:90px;">
            <input type="number" id="newExamInvigilatorCount" placeholder="监考人数" value="2" style="width:70px;">
            <button id="addExamBtn" class="btn btn-success">➕ 添加</button>
        </div>
        <div class="time-hint">⏰ 时间格式：24小时制，例如 09:00 或 14:30。不填结束时间默认为90分钟。</div>
        <div id="examLimitWarning" class="warning-text"></div>
    </div>

    <!-- 卡片三：监考教师管理 -->
    <div class="card">
        <div class="card-header">
            <h3>👩‍🏫 监考教师管理</h3>
            <div class="btn-group">
                <button id="downloadTeacherTemplateBtn" class="btn btn-secondary">📥 模板</button>
                <button id="importTeacherBtn" class="btn btn-primary">📂 导入</button>
                <button id="addTeacherBtn" class="btn btn-success">➕ 添加</button>
                <button id="clearTeachersBtn" class="btn btn-danger">🗑️ 清除</button>
            </div>
        </div>
        <div id="teacherListContainer"></div>
        <div class="time-hint">💡 导入模板格式：第一列"类别"，第二列"教师姓名"</div>
    </div>

    <!-- 卡片四：自动排监考 -->
    <div class="card">
        <div class="card-header">
            <h3>🤖 自动排监考</h3>
            <div class="btn-group">
                <select id="selectCategoryForSchedule" class="small-select" style="width:100px;"></select>
                <button id="startScheduleBtn" class="btn btn-success">🚀 开始</button>
                <button id="viewTimetableBtn" class="btn btn-primary">📅 查看</button>
                <button id="exportTimetableBtn" class="btn btn-warning">📎 导出</button>
                <button id="clearScheduleBtn" class="btn btn-danger">🗑️ 清除</button>
            </div>
        </div>
        <div id="scheduleResult" class="stat-item">⏳ 请点击"开始排监考"</div>
    </div>

    <!-- 卡片五：监考统计 -->
    <div class="card">
        <div class="card-header">
            <h3>📊 监考统计（按时长从大到小排序）</h3>
        </div>
        <div id="statContainer"></div>
        <div id="unassignedArea" class="unassigned-area" style="display:none;"></div>
    </div>
</div>

<!-- 弹窗一：考试安排表 -->
<div id="timetableModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">考试安排表</h2>
            <div>
                <span id="highlightStatus" style="font-size:12px; color:#666; margin-right:10px;"></span>
                <button id="clearHighlightBtn" class="clear-highlight-btn">清除高亮</button>
                <button class="close-modal" style="margin-left:10px;">&times;</button>
            </div>
        </div>
        <div id="timetableContainer" class="schedule-matrix"></div>
        <div class="drag-hint">
            💡 提示：点击教师可高亮所有位置；拖动教师到另一位教师位置可调换监考安排
        </div>
        <div class="btn-group" style="margin-top:12px; justify-content:flex-end;">
            <button id="modalExportBtn" class="btn btn-warning">📎 导出Excel</button>
        </div>
    </div>
</div>

<!-- 弹窗二：未安排教师名单 -->
<div id="unassignedModal" class="modal">
    <div class="modal-content" style="max-width:400px;">
        <div class="modal-header">
            <h2 id="unassignedModalTitle">⚠️ 未安排教师名单</h2>
            <button class="close-modal" style="margin-left:10px;">&times;</button>
        </div>
        <div id="unassignedModalBody" style="padding:10px 0;"></div>
        <div style="margin-top:12px; padding:8px; background:#e6f7e6; border-radius:6px; font-size:12px;">
            💡 提示：可增加考场数/考试科目/监考人数，或减少教师人数
        </div>
    </div>
</div>

<!-- 弹窗三：冲突提示 -->
<div id="conflictModal" class="modal">
    <div class="modal-content" style="max-width:450px;">
        <div class="modal-header">
            <h2>⚠️ 调换失败</h2>
            <button class="close-conflict-modal" style="margin-left:10px;">&times;</button>
        </div>
        <div id="conflictModalBody" style="padding:10px 0; line-height:1.8;"></div>
        <div class="btn-group" style="margin-top:16px; justify-content:center;">
            <button id="closeConflictBtn" class="btn btn-primary">知道了</button>
        </div>
    </div>
</div>

<!-- 弹窗四：导出配置弹窗 -->
<div id="exportConfigModal" class="modal">
    <div class="modal-content" style="max-width:500px;">
        <div class="modal-header">
            <h2>📎 导出考试安排表</h2>
            <button class="close-modal" style="margin-left:10px;">&times;</button>
        </div>
        <div id="exportConfigBody" class="export-config"></div>
        <div class="btn-group" style="margin-top:16px; justify-content:flex-end;">
            <button id="cancelExportBtn" class="btn btn-secondary">取消</button>
            <button id="confirmExportBtn" class="btn btn-success">确认导出</button>
        </div>
    </div>
</div>

<script>
    // ========== 存储KEY ==========
    const STORAGE = {
        CATEGORIES: 'exam_categories_v28',
        TEACHERS: 'exam_teachers_v28',
        INVIGILATION: 'exam_invigilation_v28'
    };

    let categories = [];
    let teachers = {};
    let invigilation = {};
    let currentCategory = null;
    let currentHighlightTeacher = null;
    let pendingExportData = null;
    let dragSource = null;

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
    
    function showToast(msg, isError = false) {
        let toast = document.createElement('div');
        toast.className = 'toast' + (isError ? ' error' : '');
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    function isValidTime(timeStr) {
        if (!timeStr) return false;
        let regex = /^([01]?[0-9]|2[0-3]):[0-5][0-9]$/;
        return regex.test(timeStr);
    }

    function getExamDuration(exam) {
        if (exam.startTime && exam.endTime && isValidTime(exam.startTime) && isValidTime(exam.endTime)) {
            let start = exam.startTime.split(':').map(Number);
            let end = exam.endTime.split(':').map(Number);
            let duration = (end[0] * 60 + end[1]) - (start[0] * 60 + start[1]);
            return duration > 0 ? duration : 90;
        }
        return 90;
    }

    function getTimeSlotKey(date, startTime, endTime) {
        return `${date || 'nodate'}_${startTime || '00:00'}-${endTime || '00:00'}`;
    }

    function getExamTimeKey(exam) {
        return getTimeSlotKey(exam.date, exam.startTime, exam.endTime);
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        let parts = dateStr.split('-');
        if (parts.length === 3) return `${parseInt(parts[1])}月${parseInt(parts[2])}日`;
        return dateStr;
    }

    function formatTimeDisplay(startTime, endTime) {
        if (startTime && endTime) {
            return startTime + '-' + endTime;
        } else if (startTime) {
            return startTime;
        }
        return '';
    }

    function parseTime(timeStr) {
        if (!timeStr) return 0;
        let parts = timeStr.split(':');
        return parseInt(parts[0]) * 60 + parseInt(parts[1]);
    }

    function isTimeOverlap(examA, examB) {
        if (examA.date !== examB.date) return false;
        let startA = parseTime(examA.startTime);
        let endA = parseTime(examA.endTime);
        let startB = parseTime(examB.startTime);
        let endB = parseTime(examB.endTime);
        if (!startA || !endA || !startB || !endB) return false;
        return startA < endB && startB < endA;
    }

    function formatTeacherNameForDisplay(name) {
        if (!name) return '';
        if (name.length === 2) {
            return name.charAt(0) + ' ' + name.charAt(1);
        }
        return name;
    }

    function formatTeacherNameForExcel(name) {
        if (!name) return '';
        if (name.length >= 3) return name.substring(0, 3);
        return name + ' '.repeat(3 - name.length);
    }

    function loadData() {
        let saved = localStorage.getItem(STORAGE.CATEGORIES);
        if (saved) categories = JSON.parse(saved);
        else categories = [];
        
        let savedTeachers = localStorage.getItem(STORAGE.TEACHERS);
        if (savedTeachers) teachers = JSON.parse(savedTeachers);
        else teachers = {};
        
        let savedInv = localStorage.getItem(STORAGE.INVIGILATION);
        if (savedInv) invigilation = JSON.parse(savedInv);
        else invigilation = {};
        
        if (categories.length > 0 && !currentCategory) currentCategory = categories[0].name;
        renderAll();
    }
    
    function saveAll() {
        localStorage.setItem(STORAGE.CATEGORIES, JSON.stringify(categories));
        localStorage.setItem(STORAGE.TEACHERS, JSON.stringify(teachers));
        localStorage.setItem(STORAGE.INVIGILATION, JSON.stringify(invigilation));
    }
    
    function renderAll() {
        renderCategoryList();
        renderExamPlan();
        renderTeacherList();
        renderCategorySelect();
        renderStatisticsAndUnassigned();
    }
    
    function renderCategoryList() {
        let container = document.getElementById('categoryList');
        if (categories.length === 0) { container.innerHTML = '<span class="status-msg">暂无类别，请添加</span>'; return; }
        
        container.innerHTML = categories.map(cat => `
            <div class="category-item ${currentCategory === cat.name ? 'active' : ''}" data-cat="${cat.name}">
                <span class="category-name">${escapeHtml(cat.name)}</span>
                <span class="delete-cat" data-cat="${cat.name}">✖</span>
            </div>
        `).join('');
        
        document.querySelectorAll('.category-item').forEach(item => {
            item.addEventListener('click', (e) => { if (e.target.classList.contains('delete-cat')) return; currentCategory = item.dataset.cat; renderAll(); });
        });
        document.querySelectorAll('.delete-cat').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); let catName = btn.dataset.cat; if (confirm(`确定删除类别"${catName}"吗？`)) { categories = categories.filter(c => c.name !== catName); delete teachers[catName]; delete invigilation[catName]; if (currentCategory === catName && categories.length > 0) currentCategory = categories[0]?.name; else if (categories.length === 0) currentCategory = null; saveAll(); renderAll(); showToast('删除成功'); } });
        });
    }
    
    function renderExamPlan() {
        let displaySpan = document.getElementById('currentCategoryDisplay');
        if (!currentCategory) { displaySpan.innerHTML = '请先选择类别'; document.getElementById('examListContainer').innerHTML = '<div class="status-msg">请先选择类别</div>'; return; }
        
        let cat = categories.find(c => c.name === currentCategory);
        if (!cat) { displaySpan.innerHTML = '类别不存在'; document.getElementById('examListContainer').innerHTML = '<div class="status-msg">类别不存在</div>'; return; }
        
        displaySpan.innerHTML = `${escapeHtml(cat.name)}`;
        document.getElementById('editSubjectCount').value = cat.subjectCount || 3;
        document.getElementById('editRoomCount').value = cat.roomCount || 3;
        document.getElementById('editInvigilatorCount').value = cat.invigilatorCount || 2;
        
        let exams = cat.exams || [];
        if (exams.length === 0) {

    // ========== 均衡排监考算法 ==========
    function startScheduling() {
        let select = document.getElementById('selectCategoryForSchedule');
        let categoryName = select.value;
        let cat = categories.find(c => c.name === categoryName);
        if (!cat) { showToast('请选择类别', true); return; }
        
        let teacherList = teachers[cat.name] || [];
        let teacherCount = teacherList.length;
        if (teacherCount === 0) { showToast(`类别"${cat.name}"下没有监考教师，请先导入`, true); return; }
        
        let exams = cat.exams || [];
        if (exams.length === 0) { showToast('请先添加考试计划', true); return; }
        
        let roomCount = cat.roomCount || 3;
        let invigilatorCountPerExam = cat.invigilatorCount || 2;
        let totalSlots = roomCount * exams.length * invigilatorCountPerExam;
        let avgSlots = totalSlots / teacherCount;
        let floorSlots = Math.floor(avgSlots);
        let ceilSlots = Math.ceil(avgSlots);
        
        let targetCounts = {};
        let teachersWithCeil = totalSlots - floorSlots * teacherCount;
        for (let i = 0; i < teacherCount; i++) {
            targetCounts[teacherList[i]] = i < teachersWithCeil ? ceilSlots : floorSlots;
        }
        
        let examDurations = exams.map(e => getExamDuration(e));
        let examTimeKeys = exams.map(e => getExamTimeKey(e));
        
        let teacherCurrentCount = {};
        let teacherCurrentDuration = {};
        let teacherSchedule = {};
        teacherList.forEach(t => {
            teacherCurrentCount[t] = 0;
            teacherCurrentDuration[t] = 0;
            teacherSchedule[t] = new Set();
        });
        
        let positions = [];
        for (let r = 0; r < roomCount; r++) {
            for (let s = 0; s < exams.length; s++) {
                for (let k = 0; k < invigilatorCountPerExam; k++) {
                    positions.push({ roomIdx: r, examIdx: s });
                }
            }
        }
        for (let i = positions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [positions[i], positions[j]] = [positions[j], positions[i]];
        }
        
        let result = Array(roomCount).fill().map(() => Array(exams.length).fill().map(() => []));
        
        for (let pos of positions) {
            let exam = exams[pos.examIdx];
            let timeKey = examTimeKeys[pos.examIdx];
            let duration = examDurations[pos.examIdx];
            
            let teacherPriority = teacherList.map(teacher => {
                let remaining = targetCounts[teacher] - teacherCurrentCount[teacher];
                let hasConflict = teacherSchedule[teacher].has(timeKey);
                return { teacher, remaining, durationScore: teacherCurrentDuration[teacher], hasConflict };
            });
            
            teacherPriority.sort((a, b) => {
                if (a.hasConflict !== b.hasConflict) return a.hasConflict ? 1 : -1;
                if (a.remaining !== b.remaining) return b.remaining - a.remaining;
                return a.durationScore - b.durationScore;
            });
            
            let selectedTeacher = null;
            for (let tp of teacherPriority) {
                if (!tp.hasConflict && tp.remaining > 0) {
                    selectedTeacher = tp.teacher;
                    break;
                }
            }
            if (!selectedTeacher) {
                for (let tp of teacherPriority) {
                    if (!tp.hasConflict) {
                        selectedTeacher = tp.teacher;
                        break;
                    }
                }
            }
            if (!selectedTeacher) {
                selectedTeacher = teacherPriority[0].teacher;
            }
            
            teacherCurrentCount[selectedTeacher]++;
            teacherCurrentDuration[selectedTeacher] += duration;
            teacherSchedule[selectedTeacher].add(timeKey);
            result[pos.roomIdx][pos.examIdx].push(selectedTeacher);
        }
        
        invigilation[cat.name] = { result, exams, roomCount, invigilatorCount: invigilatorCountPerExam };
        saveAll();
        
        let countsArray = Object.values(teacherCurrentCount);
        let durationsArray = Object.values(teacherCurrentDuration);
        let maxCount = Math.max(...countsArray);
        let minCount = Math.min(...countsArray);
        let maxDuration = Math.max(...durationsArray);
        let minDuration = durationsArray.filter(d => d > 0).length > 0 ? Math.min(...durationsArray.filter(d => d > 0)) : 0;
        let avgDuration = durationsArray.reduce((a,b) => a+b, 0) / teacherCount;
        let unassignedCount = countsArray.filter(c => c === 0).length;
        
        let resultHtml = `✅ 排监考完成！<br>📊 总需求：${totalSlots} 人次 | 教师人数：${teacherCount} 人 | 理论人均：${avgSlots.toFixed(2)} 次/人<br>🎯 实际安排：最多 ${maxCount} 次，最少 ${minCount} 次<br>⏱️ 监考时长：最长 ${maxDuration} 分钟，最短 ${minDuration} 分钟，平均 ${avgDuration.toFixed(0)} 分钟`;
        if (unassignedCount > 0) resultHtml += `<br>⚠️ 未安排教师：${unassignedCount} 人（需求不足导致）`;
        document.getElementById('scheduleResult').innerHTML = resultHtml;
        renderStatisticsAndUnassigned();
        showToast('排监考完成');
    }
    
    // ========== 拖拽冲突检测 ==========
    function checkSwapConflict(categoryName, teacherA, teacherB, posA, posB) {
        let data = invigilation[categoryName];
        if (!data) return { hasConflict: true, message: '数据不存在' };
        
        let exams = data.exams;
        let examA = exams[posA.examIdx];
        let examB = exams[posB.examIdx];
        
        let teacherSchedule = {};
        for (let r = 0; r < data.result.length; r++) {
            for (let s = 0; s < data.result[r].length; s++) {
                let teachersList = data.result[r][s];
                let exam = exams[s];
                for (let teacher of teachersList) {
                    if ((teacher === teacherA && r === posA.roomIdx && s === posA.examIdx) ||
                        (teacher === teacherB && r === posB.roomIdx && s === posB.examIdx)) {
                        continue;
                    }
                    if (!teacherSchedule[teacher]) teacherSchedule[teacher] = [];
                    teacherSchedule[teacher].push({ exam, room: r + 1 });
                }
            }
        }
        
        let conflictA = checkTeacherTimeConflict(teacherA, examB, teacherSchedule);
        if (conflictA.hasConflict) {
            return { hasConflict: true, message: conflictA.message };
        }
        
        let conflictB = checkTeacherTimeConflict(teacherB, examA, teacherSchedule);
        if (conflictB.hasConflict) {
            return { hasConflict: true, message: conflictB.message };
        }
        
        return { hasConflict: false };
    }
    
    function checkTeacherTimeConflict(teacher, newExam, teacherSchedule) {
        let existingSlots = teacherSchedule[teacher] || [];
        
        for (let slot of existingSlots) {
            if (isTimeOverlap(newExam, slot.exam)) {
                return { 
                    hasConflict: true, 
                    message: `${teacher} 在 ${formatDate(slot.exam.date)} ${slot.exam.startTime}-${slot.exam.endTime} 已有监考任务（${slot.exam.subject}-考场${slot.room}），与 ${newExam.subject} 时间重叠` 
                };
            }
        }
        return { hasConflict: false };
    }
    
    function executeSwap(categoryName, teacherA, teacherB, posA, posB) {
        let data = invigilation[categoryName];
        if (!data) return false;
        
        let cellA = data.result[posA.roomIdx][posA.examIdx];
        let cellB = data.result[posB.roomIdx][posB.examIdx];
        
        let idxA = cellA.indexOf(teacherA);
        let idxB = cellB.indexOf(teacherB);
        
        if (idxA === -1 || idxB === -1) return false;
        
        cellA[idxA] = teacherB;
        cellB[idxB] = teacherA;
        
        saveAll();
        return true;
    }

    function bindDragEvents() {
        const cells = document.querySelectorAll('#timetableContainer .teacher-cell[draggable="true"]');
        
        cells.forEach(cell => {
            cell.removeEventListener('dragstart', dragStart);
            cell.removeEventListener('dragend', dragEnd);
            cell.removeEventListener('dragover', dragOver);
            cell.removeEventListener('dragleave', dragLeave);
            cell.removeEventListener('drop', drop);
            
            cell.addEventListener('dragstart', dragStart);
            cell.addEventListener('dragend', dragEnd);
            cell.addEventListener('dragover', dragOver);
            cell.addEventListener('dragleave', dragLeave);
            cell.addEventListener('drop', drop);
        });
    }
    
    function dragStart(e) {
        dragSource = {
            teacher: e.target.dataset.teacher,
            category: e.target.dataset.cat,
            room: parseInt(e.target.dataset.room),
            exam: parseInt(e.target.dataset.exam)
        };
        e.dataTransfer.setData('text/plain', JSON.stringify(dragSource));
        e.target.style.opacity = '0.5';
    }
    
    function dragEnd(e) {
        e.target.style.opacity = '';
        document.querySelectorAll('#timetableContainer .teacher-cell').forEach(cell => {
            cell.classList.remove('drag-over');
        });
        dragSource = null;
    }
    
    function dragOver(e) {
        e.preventDefault();
        if (!dragSource) return;
        let targetCell = e.target.closest('.teacher-cell');
        if (targetCell && targetCell.draggable === 'true') {
            targetCell.classList.add('drag-over');
        }
    }
    
    function dragLeave(e) {
        let targetCell = e.target.closest('.teacher-cell');
        if (targetCell) targetCell.classList.remove('drag-over');
    }
    
    function drop(e) {
        e.preventDefault();
        let targetCell = e.target.closest('.teacher-cell');
        if (!targetCell || !dragSource) return;
        targetCell.classList.remove('drag-over');
        
        let targetData = {
            teacher: targetCell.dataset.teacher,
            category: targetCell.dataset.cat,
            room: parseInt(targetCell.dataset.room),
            exam: parseInt(targetCell.dataset.exam)
        };
        
        if (dragSource.room === targetData.room && dragSource.exam === targetData.exam && dragSource.teacher === targetData.teacher) {
            return;
        }
        
        let categoryName = dragSource.category;
        let teacherA = dragSource.teacher;
        let teacherB = targetData.teacher;
        let posA = { roomIdx: dragSource.room, examIdx: dragSource.exam };
        let posB = { roomIdx: targetData.room, examIdx: targetData.exam };
        
        let conflict = checkSwapConflict(categoryName, teacherA, teacherB, posA, posB);
        
        if (conflict.hasConflict) {
            showConflictModal(conflict.message);
        } else {
            executeSwap(categoryName, teacherA, teacherB, posA, posB);
            renderTimetableContent(categoryName);
            renderStatisticsAndUnassigned();
            showToast('调换成功，已保存');
        }
    }
    
    function showConflictModal(message) {
        let modal = document.getElementById('conflictModal');
        let body = document.getElementById('conflictModalBody');
        body.innerHTML = `<div style="padding:10px;">无法将教师调换到目标位置。<br><br>冲突原因：<br>• ${escapeHtml(message)}<br><br>建议：请先调整冲突场次，或选择其他教师进行调换。</div>`;
        modal.style.display = 'flex';
    }
    
    function clearSchedule() {
        let select = document.getElementById('selectCategoryForSchedule');
        let categoryName = select.value;
        if (invigilation[categoryName]) { delete invigilation[categoryName]; saveAll(); renderAll(); showToast('已清除排监考结果'); }
        else showToast('暂无排监考结果', true);
    }
    
    // ========== 导出功能 ==========
    function showExportDialog() {
        let select = document.getElementById('selectCategoryForSchedule');
        let categoryName = select.value;
        let cat = categories.find(c => c.name === categoryName);
        if (!cat || !invigilation[cat.name]) { showToast('请先排监考', true); return; }
        
        let data = invigilation[cat.name];
        let exams = data.exams;
        let examCount = exams.length;
        
        pendingExportData = { cat, data, categoryName };
        
        let modal = document.getElementById('exportConfigModal');
        let body = document.getElementById('exportConfigBody');
        
        let savedSchool = localStorage.getItem('export_school') || '××市第一中学';
        let savedYear = localStorage.getItem('export_year') || '2025-2026学年';
        let savedSemester = localStorage.getItem('export_semester') || '第一学期';
        let savedExamType = localStorage.getItem('export_examType') || '期中考试';
        
        let warningHtml = '';
        if (examCount > 7) {
            warningHtml = `
                <div class="warning-box">
                    <div class="title">⚠️ 当前共有 ${examCount} 个考试科目</div>
                    <div>将自动切换为纵向打印模式：</div>
                </div>
            `;
        }
        
        body.innerHTML = `
            <div class="config-row"><label>学校名称：</label><input type="text" id="exportSchoolName" value="${escapeHtml(savedSchool)}"></div>
            <div class="config-row"><label>学　　年：</label><input type="text" id="exportYear" value="${escapeHtml(savedYear)}"></div>
            <div class="config-row"><label>学　　期：</label><input type="text" id="exportSemester" value="${escapeHtml(savedSemester)}"></div>
            <div class="config-row"><label>考试类型：</label><input type="text" id="exportExamType" value="${escapeHtml(savedExamType)}"></div>
            ${warningHtml}
        `;
        modal.style.display = 'flex';
    }
    
    function doExport() {
        if (!pendingExportData) return;
        
        let { cat, data, categoryName } = pendingExportData;
        let exams = data.exams;
        let result = data.result;
        let roomCount = data.roomCount;
        
        let schoolName = document.getElementById('exportSchoolName')?.value || '××市第一中学';
        let year = document.getElementById('exportYear')?.value || '2025-2026学年';
        let semester = document.getElementById('exportSemester')?.value || '第一学期';
        let examType = document.getElementById('exportExamType')?.value || '期中考试';
        
        localStorage.setItem('export_school', schoolName);
        localStorage.setItem('export_year', year);
        localStorage.setItem('export_semester', semester);
        localStorage.setItem('export_examType', examType);
        
        let examCount = exams.length;
        let isLandscape = examCount <= 7;
        
        exportToExcel(schoolName, year, semester, examType, exams, result, roomCount, isLandscape, categoryName);
        
        document.getElementById('exportConfigModal').style.display = 'none';
        pendingExportData = null;
        showToast('导出成功');
    }
    
    function exportToExcel(schoolName, year, semester, examType, exams, result, roomCount, isLandscape, categoryName) {
        let dateGroups = {};
        for (let i = 0; i < exams.length; i++) {
            let exam = exams[i];
            let dateKey = exam.date || 'nodate';
            if (!dateGroups[dateKey]) dateGroups[dateKey] = [];
            dateGroups[dateKey].push({ exam, index: i });
        }
        
        let dateRow = ['考场/科目'];
        let subjectRow = [''];
        let timeRow = [''];
        
        for (let dateKey in dateGroups) {
            let group = dateGroups[dateKey];
            let dateStr = formatDate(dateKey);
            for (let item of group) {
                dateRow.push(dateStr);
                subjectRow.push(item.exam.subject);
                let timeStr = formatTimeDisplay(item.exam.startTime, item.exam.endTime);
                timeRow.push(timeStr);
            }
        }
        
        let dataRows = [];
        for (let r = 0; r < roomCount; r++) {
            let row = [`考场 ${r+1}`];
            for (let s = 0; s < exams.length; s++) {
                let teachersList = result[r][s] || [];
                if (teachersList.length > 0) {
                    // 监考老师姓名分两行显示（每行最多3个）
                    let teachersPerRow = 3;
                    let teacherGroups = [];
                    for (let i = 0; i < teachersList.length; i += teachersPerRow) {
                        let group = teachersList.slice(i, i + teachersPerRow);
                        teacherGroups.push(group.join('、'));
                    }
                    row.push(teacherGroups.join('\n'));
                } else {
                    row.push('待安排');
                }
            }
            dataRows.push(row);
        }
        
        let sheetData = [];
        sheetData.push([`${schoolName}`]);
        sheetData.push([`${year} ${semester} ${examType} 监考安排表`]);
        sheetData.push([]);
        sheetData.push(dateRow);
        sheetData.push(subjectRow);
        sheetData.push(timeRow);
        for (let row of dataRows) sheetData.push(row);
        
        let wb = XLSX.utils.book_new();
        let ws = XLSX.utils.aoa_to_sheet(sheetData);
        
        let colWidths = [{ wch: 10 }];
        for (let i = 0; i < exams.length; i++) colWidths.push({ wch: 14 });
        ws['!cols'] = colWidths;
        
        // 设置行高
        if (!ws['!rows']) ws['!rows'] = [];
        for (let i = 6; i < sheetData.length; i++) {
            ws['!rows'][i] = { hpt: 40 };
        }
        
        let sheetName = isLandscape ? '考试安排表(横)' : '考试安排表(纵)';
        XLSX.utils.book_append_sheet(wb, ws, sheetName);
        
        XLSX.writeFile(wb, `${categoryName}_考试安排表.xlsx`);
    }
    
    function downloadExamTemplate() {
        let templateData = [['考试名称', '科目', '日期(YYYY-MM-DD)', '开始时间(HH:MM)', '结束时间(HH:MM)', '监考人数']];
        templateData.push(['期中考试', '语文', '2025-01-15', '09:00', '11:00', '2']);
        let ws = XLSX.utils.aoa_to_sheet(templateData);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '考试模板');
        XLSX.writeFile(wb, '考试计划模板.xlsx');
    }
    
    function importExamExcel() {
        if (!currentCategory) { showToast('请先选择类别', true); return; }
        let input = document.createElement('input');
        input.type = 'file';
        input.accept = '.xlsx, .xls';
        input.onchange = function(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(evt) {
                let data = new Uint8Array(evt.target.result);
                let workbook = XLSX.read(data, { type: 'array' });
                let sheet = workbook.Sheets[workbook.SheetNames[0]];
                let rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                if (!rows || rows.length < 2) { showToast('文件无数据', true); return; }
                let headers = rows[0];
                let nameIdx = headers.findIndex(h => h && (h.includes('名称') || h.toLowerCase().includes('name')));
                let subjectIdx = headers.findIndex(h => h && (h.includes('科目') || h.toLowerCase().includes('subject')));
                let dateIdx = headers.findIndex(h => h && (h.includes('日期') || h.toLowerCase().includes('date')));
                let startIdx = headers.findIndex(h => h && (h.includes('开始') || h.toLowerCase().includes('start')));
                let endIdx = headers.findIndex(h => h && (h.includes('结束') || h.toLowerCase().includes('end')));
                let countIdx = headers.findIndex(h => h && (h.includes('监考人数') || h.includes('人数')));
                if (nameIdx === -1 || subjectIdx === -1) { showToast('请确保表格包含"考试名称"和"科目"列', true); return; }
                let cat = categories.find(c => c.name === currentCategory);
                if (!cat) return;
                if (!cat.exams) cat.exams = [];
                for (let i = 1; i < rows.length; i++) {
                    let row = rows[i];
                    let name = row[nameIdx]?.toString().trim();
                    let subject = row[subjectIdx]?.toString().trim();
                    if (!name || !subject) continue;
                    let date = dateIdx !== -1 ? (row[dateIdx] || '') : '';
                    let startTime = startIdx !== -1 ? (row[startIdx] || '') : '';
                    let endTime = endIdx !== -1 ? (row[endIdx] || '') : '';
                    let invigilatorCount = countIdx !== -1 ? parseInt(row[countIdx]) || cat.invigilatorCount || 2 : cat.invigilatorCount || 2;
                    cat.exams.push({ name, subject, date, startTime, endTime, invigilatorCount });
                }
                delete invigilation[currentCategory];
                saveAll();
                renderAll();
                showToast(`导入成功，共导入 ${cat.exams.length} 个考试`);
            };
            reader.readAsArrayBuffer(file);
        };
        input.click();
    }
    
    function downloadTeacherTemplate() {
        let templateData = [['类别', '教师姓名']];
        templateData.push(['高一', '张三']);
        templateData.push(['高一', '李四']);
        templateData.push(['高二', '王五']);
        let ws = XLSX.utils.aoa_to_sheet(templateData);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '教师模板');
        XLSX.writeFile(wb, '监考教师模板.xlsx');
    }
    
    function importTeacherExcel() {
        let input = document.createElement('input');
        input.type = 'file';
        input.accept = '.xlsx, .xls';
        input.onchange = function(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(evt) {
                let data = new Uint8Array(evt.target.result);
                let workbook = XLSX.read(data, { type: 'array' });
                let sheet = workbook.Sheets[workbook.SheetNames[0]];
                let rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                if (!rows || rows.length < 2) { showToast('文件无数据', true); return; }
                let headers = rows[0];
                let categoryIdx = headers.findIndex(h => h && (h.includes('类别') || h.toLowerCase().includes('category')));
                let nameIdx = headers.findIndex(h => h && (h.includes('教师') || h.includes('姓名') || h.toLowerCase().includes('name')));
                if (categoryIdx === -1 || nameIdx === -1) {
                    showToast('请确保表格包含"类别"和"教师姓名"列', true);
                    return;
                }
                let importedCount = 0;
                for (let i = 1; i < rows.length; i++) {
                    let row = rows[i];
                    let category = row[categoryIdx]?.toString().trim();
                    let teacherName = row[nameIdx]?.toString().trim();
                    if (!category || !teacherName) continue;
                    if (!teachers[category]) teachers[category] = [];
                    if (!teachers[category].includes(teacherName)) {
                        teachers[category].push(teacherName);
                        importedCount++;
                    }
                    if (!categories.find(c => c.name === category)) {
                        categories.push({ name: category, roomCount: 3, invigilatorCount: 2, subjectCount: 3, exams: [] });
                    }
                }
                delete invigilation[currentCategory];
                saveAll();
                renderAll();
                showToast(`导入成功，共导入 ${importedCount} 位教师`);
            };
            reader.readAsArrayBuffer(file);
        };
        input.click();
    }
    
    function addTeacher() {
        let select = document.getElementById('selectCategoryForSchedule');
        let categoryName = select.value;
        let newName = prompt('请输入教师姓名：');
        if (newName && newName.trim()) { if (!teachers[categoryName]) teachers[categoryName] = []; teachers[categoryName].push(newName.trim()); delete invigilation[categoryName]; saveAll(); renderAll(); showToast('添加成功'); }
    }
    
    function clearTeachers() {
        let select = document.getElementById('selectCategoryForSchedule');
        let categoryName = select.value;
        if (teachers[categoryName] && teachers[categoryName].length > 0) { if (confirm(`确定清空"${categoryName}"的教师列表吗？`)) { teachers[categoryName] = []; delete invigilation[categoryName]; saveAll(); renderAll(); showToast('已清空'); } }
        else showToast('该类别暂无教师', true);
    }
    
    function clearExams() {
        if (!currentCategory) { showToast('请先选择类别', true); return; }
        let cat = categories.find(c => c.name === currentCategory);
        if (cat && cat.exams && cat.exams.length > 0) { if (confirm(`确定清空"${currentCategory}"的考试计划吗？`)) { cat.exams = []; delete invigilation[currentCategory]; saveAll(); renderAll(); showToast('已清空考试计划'); } }
        else showToast('暂无考试计划', true);
    }
    
    // 事件绑定
    document.getElementById('addCategoryBtn').addEventListener('click', () => {
        let name = document.getElementById('newCategoryName').value.trim();
        if (!name) { showToast('请输入类别名称', true); return; }
        if (categories.find(c => c.name === name)) { showToast('类别已存在', true); return; }
        categories.push({ name, roomCount: 3, invigilatorCount: 2, subjectCount: 3, exams: [] });
        if (!currentCategory) currentCategory = name;
        saveAll(); renderAll(); document.getElementById('newCategoryName').value = ''; showToast('添加成功');
    });
    document.getElementById('saveConfigBtn').addEventListener('click', saveConfig);
    document.getElementById('addExamBtn').addEventListener('click', addExam);
    document.getElementById('startScheduleBtn').addEventListener('click', startScheduling);
    document.getElementById('viewTimetableBtn').addEventListener('click', showTimetable);
    document.getElementById('exportTimetableBtn').addEventListener('click', showExportDialog);
    document.getElementById('clearScheduleBtn').addEventListener('click', clearSchedule);
    document.getElementById('downloadExamTemplateBtn').addEventListener('click', downloadExamTemplate);
    document.getElementById('importExamBtn').addEventListener('click', importExamExcel);
    document.getElementById('clearExamsBtn').addEventListener('click', clearExams);
    document.getElementById('downloadTeacherTemplateBtn').addEventListener('click', downloadTeacherTemplate);
    document.getElementById('importTeacherBtn').addEventListener('click', importTeacherExcel);
    document.getElementById('addTeacherBtn').addEventListener('click', addTeacher);
    document.getElementById('clearTeachersBtn').addEventListener('click', clearTeachers);
    
    // 关闭弹窗
    document.querySelectorAll('.close-modal').forEach(btn => { btn.addEventListener('click', () => { document.getElementById('timetableModal').style.display = 'none'; document.getElementById('unassignedModal').style.display = 'none'; document.getElementById('exportConfigModal').style.display = 'none'; document.getElementById('conflictModal').style.display = 'none'; currentHighlightTeacher = null; }); });
    document.querySelectorAll('.close-conflict-modal').forEach(btn => { btn.addEventListener('click', () => { document.getElementById('conflictModal').style.display = 'none'; }); });
    document.getElementById('clearHighlightBtn').addEventListener('click', () => { currentHighlightTeacher = null; document.getElementById('highlightStatus').innerHTML = ''; document.querySelectorAll('.teacher-cell').forEach(c => c.classList.remove('highlight')); });
    document.getElementById('modalExportBtn').addEventListener('click', showExportDialog);
    document.getElementById('cancelExportBtn')?.addEventListener('click', () => { document.getElementById('exportConfigModal').style.display = 'none'; pendingExportData = null; });
    document.getElementById('confirmExportBtn')?.addEventListener('click', doExport);
    document.getElementById('closeConflictBtn')?.addEventListener('click', () => { document.getElementById('conflictModal').style.display = 'none'; });
    document.getElementById('backBtn').addEventListener('click', () => { showToast('返回目录功能待集成'); });
    document.getElementById('logoutBtn').addEventListener('click', () => { showToast('退出登录功能待集成'); });
    
    loadData();
</script>
